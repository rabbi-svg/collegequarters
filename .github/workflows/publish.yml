# Publishes the website to GitHub Pages with the office's current wording written into the pages,
# so Google and link previews (which read the page before any script runs) see it too.
# Runs on every change to main, once a day, and by hand (Actions tab -> Publish website -> Run workflow).
name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 9 * * *"   # every day around 5:47 am Eastern (GitHub may start it a little late)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check wording.json
        run: python3 tools/check_wording.py

      - name: Build the site with the office's wording
        run: python3 tools/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
