# Publishes the website to GitHub Pages, with the wording, rooms and contact details from
# data/site.json written into the pages. The Rentals app's Website tab saves data/site.json to main
# (GitHub API), which starts this run. Also runs on every other change to main, and by hand
# (Actions tab -> Publish website -> Run workflow).
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check wording.json
        run: python3 tools/check_wording.py

      - name: Build the site from data/site.json
        run: python3 tools/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
