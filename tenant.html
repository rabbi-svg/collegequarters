<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sends a tenant's private link (/tenant?sign=...) on to the Rentals app, keeping everything after the "?".
       The link carries a private key: no outside scripts, fonts, analytics or trackers on this page, ever,
       and no referrer is sent. All visible text comes from wording.json. See CLAUDE.md before editing any text. -->
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex, nofollow">
  <title data-w="tenant.pageTitle">College Quarters</title>
  <script>
    (function () {
      var APP = "https://script.google.com/a/jewishbobcats.com/macros/s/AKfycbwzun38kkYzRn2IHmWfsK7O_mP94rUlQKD6AXve26XokUHlufXDuC_XGAXVI4YoJbY/exec";
      var q = location.search;
      if (/[?&]sign=[^&]/.test(q)) {
        location.replace(APP + q);
      } else {
        document.documentElement.className = "incomplete";
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #1b2420; background: #f5f7f5; text-align: center; padding: 24px; box-sizing: border-box; }
    p { display: none; font-size: 1.15rem; line-height: 1.5; max-width: 32em; margin: 0; white-space: pre-line; }
    .incomplete p { display: block; }
  </style>
</head>
<body>
  <main>
    <p data-w="tenant.incomplete">This link is not complete. Please ask the office for your link.</p>
  </main>
</body>
</html>
